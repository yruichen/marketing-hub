name: Feature request
description: Propose an improvement to Marketing Hub
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find the same proposal.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has this problem, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the successful user outcome without prescribing implementation details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Share a possible product or technical approach.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication and accounts
        - Workspaces and projects
        - AI generation
        - Workflow builder
        - Community
        - Billing and usage
        - AI Gateway and providers
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable behavior would make this complete?
