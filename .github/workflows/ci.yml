name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-guard:
    name: Secrets Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Block committed env files
        run: |
          set -euo pipefail
          forbidden=()
          while IFS= read -r file; do
            forbidden+=("$file")
          done < <(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -Ev '\.env\.example$' || true)
          if ((${#forbidden[@]} > 0)); then
            echo "::error::Forbidden env files committed: ${forbidden[*]}"
            exit 1
          fi

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: secrets-guard
    defaults:
      run:
        working-directory: ./backend

    env:
      DJANGO_SECRET_KEY: dummy-key-for-testing-only
      DJANGO_DEBUG: "True"
      MARKETING_HUB_BOOTSTRAP_DEMO: "True"
      AI_ALLOW_MOCK_PROVIDER: "True"
      AI_ALLOW_MOCK_FALLBACK: "True"
      ALLOW_UNAUTHENTICATED_API: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install backend dependencies
        run: uv sync

      - name: Run Django system checks
        run: uv run python manage.py check

      - name: Apply migrations for smoke checks
        run: uv run python manage.py migrate --noinput

      - name: Run production settings smoke check
        run: DJANGO_DEBUG=False DJANGO_SECRET_KEY=ci-production-smoke-secret-with-more-than-fifty-unique-characters-12345 DJANGO_ALLOWED_HOSTS=example.com CORS_ALLOW_ALL_ORIGINS=False ALLOW_UNAUTHENTICATED_API=False AI_ALLOW_MOCK_PROVIDER=False AI_ALLOW_MOCK_FALLBACK=False MARKETING_HUB_BOOTSTRAP_DEMO=False SECURE_SSL_REDIRECT=True SECURE_HSTS_SECONDS=31536000 SECURE_HSTS_INCLUDE_SUBDOMAINS=True SECURE_HSTS_PRELOAD=True FIELD_ENCRYPTION_KEY=ci-field-encryption-key-for-production-smoke-check uv run python manage.py check --deploy

      - name: Check migration drift
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: uv run python manage.py test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: secrets-guard
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Linting
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test

      - name: Build Frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: marketing-hub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: false
          load: true
          tags: marketing-hub-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
