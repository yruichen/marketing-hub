name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    env:
      DJANGO_SECRET_KEY: dummy-key-for-testing-only
      DJANGO_DEBUG: "True"
      MARKETING_HUB_BOOTSTRAP_DEMO: "True"
      AI_ALLOW_MOCK_PROVIDER: "True"
      AI_ALLOW_MOCK_FALLBACK: "True"
      ALLOW_UNAUTHENTICATED_API: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install backend dependencies
        run: uv sync

      - name: Run Django system checks
        run: uv run python manage.py check

      - name: Run production settings smoke check
        run: DJANGO_DEBUG=False DJANGO_SECRET_KEY=ci-production-smoke-secret-with-more-than-fifty-unique-characters-12345 DJANGO_ALLOWED_HOSTS=example.com CORS_ALLOW_ALL_ORIGINS=False ALLOW_UNAUTHENTICATED_API=False AI_ALLOW_MOCK_PROVIDER=False AI_ALLOW_MOCK_FALLBACK=False MARKETING_HUB_BOOTSTRAP_DEMO=False SECURE_SSL_REDIRECT=True SECURE_HSTS_SECONDS=31536000 SECURE_HSTS_INCLUDE_SUBDOMAINS=True SECURE_HSTS_PRELOAD=True uv run python manage.py check --deploy

      - name: Check migration drift
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: uv run python manage.py test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Linting
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test

      - name: Build Frontend
        run: npm run build
