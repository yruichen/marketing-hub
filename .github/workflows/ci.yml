name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-guard:
    name: Secrets Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test repository audit
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Audit tracked public content
        run: python3 scripts/audit_public_release.py --tracked .

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: secrets-guard
    defaults:
      run:
        working-directory: ./backend

    env:
      DJANGO_SECRET_KEY: dummy-key-for-testing-only
      DJANGO_DEBUG: "True"
      ALLOW_UNAUTHENTICATED_API: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install backend dependencies
        run: uv sync

      - name: Run Django system checks
        run: uv run python manage.py check

      - name: Apply migrations for smoke checks
        run: uv run python manage.py migrate --noinput

      - name: Load legal policy fixtures for production smoke check
        run: uv run python manage.py loaddata tests/fixtures/production_smoke_policies.json

      - name: Run production settings smoke check
        run: DJANGO_DEBUG=False DJANGO_SECRET_KEY=ci-production-smoke-secret-with-more-than-fifty-unique-characters-12345 DJANGO_ALLOWED_HOSTS=example.com CORS_ALLOW_ALL_ORIGINS=False ALLOW_UNAUTHENTICATED_API=False SECURE_SSL_REDIRECT=True SECURE_HSTS_SECONDS=31536000 SECURE_HSTS_INCLUDE_SUBDOMAINS=True SECURE_HSTS_PRELOAD=True FIELD_ENCRYPTION_KEY=ci-field-encryption-key-for-production-smoke-check uv run python manage.py check --deploy

      - name: Check migration drift
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: uv run python manage.py test

      - name: Run harness architecture tests
        run: uv run python -m unittest discover -s harness/tests -p 'test_*.py'

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: secrets-guard
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Linting
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test

      - name: Build Frontend
        run: npm run build

  desktop:
    name: Desktop Host CI
    runs-on: ubuntu-latest
    needs: secrets-guard
    defaults:
      run:
        working-directory: ./desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./desktop/package-lock.json"

      - name: Install desktop dependencies
        run: npm ci

      - name: Check desktop types
        run: npm run typecheck

      - name: Run desktop boundary tests
        run: npm run test

      - name: Build desktop host
        run: npm run build:host

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: marketing-hub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: false
          load: true
          tags: marketing-hub-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
