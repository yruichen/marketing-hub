    {"workflow_name":"string","brand_context":{"brand_name":"string","audience":"string","tone":"string","selling_points":"string","visual_style":"string","campaign_goal":"string"},"nodes":[{"id":"string","type":"supported type","label":"string","x":80,"y":120,"width":260,"height":166,"config":{}}],"edges":[{"id":"string","source":"node id","target":"node id"}],"summary":"string"}
  quality_bar:
