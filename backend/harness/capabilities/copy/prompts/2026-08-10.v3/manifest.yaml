prompt:
  key: marketing.copy.system
  version: 2026-08-10.v3
  locale: en-US
  default: true
  kind: system_prompt
  owner: content-generation
  task_type: copy
  title: Marketing copy generation
  description: Produces evidence-bounded, channel-native marketing copy.
  output_contract: title, paragraphs[], tags[], call_to_action
  evaluation_profile: copy-quality-v3
  risk: medium
  system_file: system.md
  user_file: user.md
  schema_hint: |
    {"title":"string","paragraphs":["string"],"tags":["string"],"call_to_action":"string"}
  quality_bar:
    - The hook names a recognizable audience situation, tension, or outcome.
    - Each paragraph has a distinct job and no unsupported factual claim.
    - Tone, structure, tags, and call to action fit the target channel.
    - Output is valid JSON and satisfies the response contract.
