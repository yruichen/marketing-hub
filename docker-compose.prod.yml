services:
  postgres:
    restart: unless-stopped
    ports: !override []

  redis:
    restart: unless-stopped
    ports: !override []

  backend:
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      CELERY_TASK_ALWAYS_EAGER: "false"
      # HTTP deployment (no TLS yet): allow session/CSRF cookies over http://IP:5173
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-false}"
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/schema/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    restart: unless-stopped
    ports: !override
      - "${FRONTEND_PORT:-5173}:80"
    environment: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
